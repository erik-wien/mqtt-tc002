name: MQTT-TC002-iOS
options:
  bundleIdPrefix: cloud.eriks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TC002:
    path: .

targets:
  MQTT-TC002-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/TC002iOS
      - path: Icons
        type: folder
        buildPhase: resources
      - path: Resources/Schriften
        type: folder
        buildPhase: resources
      # Der `.lproj`-Ordner selbst, nicht sein Elternordner: Xcode behandelt
      # `.lproj` besonders und legt seinen Inhalt in die Buendelwurzel. Der
      # Elternordner ergaebe `Sprachen/en.lproj`, und dort sucht niemand — die
      # englische Fassung waere stillschweigend wirkungslos.
      - path: Resources/Sprachen/en.lproj
        buildPhase: resources
      # Deutsch ist die Entwicklungssprache und braucht keine
      # Localizable.strings — aber ohne einen eigenen .lproj-Ordner im
      # Buendel gilt fuer iOS nur Englisch als angebotene Sprache, und ein
      # deutsches Telefon bekaeme die App auf Englisch. Derselbe Trick wie
      # fuer den Mac in build.sh.
      - path: Resources/Sprachen/de.lproj
        buildPhase: resources
      - path: Resources/AppIconiOS.xcassets
        buildPhase: resources
      # Die GPL-3.0 gehoert ins Buendel, nicht nur als Verweis: Das Ueber-Blatt
      # zeigt den Text an, und die Lizenz verlangt, ihn mitzuliefern. Die drei
      # OFL-Texte der Pixelschriften fahren schon mit, weil `Resources/Schriften`
      # oben als ganzer Ordner mitgeht — die LICENSE liegt in der Wurzel und
      # braucht deshalb ihre eigene Zeile. Am Mac tut dasselbe `build.sh`.
      - path: LICENSE
        buildPhase: resources
      # Die Geraetereferenz, beide Sprachen. `GeraeteReferenzView` liegt seit
      # dem Umzug in `TC002Ansichten` und wird damit auch fuers iPhone
      # uebersetzt; sie sucht das Dokument in der Buendelwurzel und zeigt sonst
      # einen Fehlerschirm, der aufs Bauen mit ./build.sh verweist — am iPhone
      # eine Begruendung in die falsche Richtung. Einzelne Dateien, kein
      # `type: folder`: Sie sollen in der Wurzel liegen, nicht in `docs/`. Am
      # Mac kopiert `build.sh` dieselben zwei.
      - path: docs/tc002-protokoll.md
        buildPhase: resources
      - path: docs/en/tc002-protocol.md
        buildPhase: resources
    dependencies:
      - package: TC002
        product: TC002Core
      - package: TC002
        product: TC002Modell
      - package: TC002
        product: TC002Ansichten
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.eriks.mqtt-tc002
        DEVELOPMENT_TEAM: 25ZK4SS655
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_ASSET_PATHS: ""
    info:
      # NICHT nach build/ — das ist das Ausgabeverzeichnis der Mac-App, und
      # `release.sh` raeumt es mit `rm -rf` ab. Diese Datei ist aber eine
      # **Eingabe** des iOS-Projekts: Ist sie weg, bricht Xcode mit
      # „Build input file cannot be found" ab. Am 12.09.2026 genau so passiert,
      # mitten in einer Veroeffentlichung.
      path: erzeugt/InfoiOS.plist
      properties:
        CFBundleName: MQTT-TC002
        CFBundleDisplayName: MQTT-TC002
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        # Zwei Schluessel, nicht einer: Das iPhone bleibt im Hochformat — die
        # iPhone-Oberflaeche (`SendeniOS`) ist darauf gerechnet. Das iPad zeigt
        # den Schreibtisch und dreht sich, quer wie hochkant. Fehlte die
        # `~ipad`-Fassung, gaelte der Schluessel darunter auch dort, und auf dem
        # iPad staende eine hochformatgesperrte Schreibtischoberflaeche — ein
        # Bau, der gelingt, und ein Geraet, das sich nicht drehen laesst.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Ohne diesen Eintrag erreicht die App weder Uhr noch Broker, und die
        # Fehlermeldung zeigt in die falsche Richtung — derselbe Fall wie auf
        # dem Mac.
        NSLocalNetworkUsageDescription: >-
          Die App spricht die Pixeluhr und den MQTT-Broker in Ihrem Heimnetz an.
