name: MQTT-TC002-iOS
options:
  bundleIdPrefix: cloud.eriks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TC002:
    path: .

targets:
  MQTT-TC002-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/TC002iOS
      - path: Icons
        type: folder
        buildPhase: resources
      - path: Resources/Schriften
        type: folder
        buildPhase: resources
      # Der `.lproj`-Ordner selbst, nicht sein Elternordner: Xcode behandelt
      # `.lproj` besonders und legt seinen Inhalt in die Buendelwurzel. Der
      # Elternordner ergaebe `Sprachen/en.lproj`, und dort sucht niemand — die
      # englische Fassung waere stillschweigend wirkungslos.
      - path: Resources/Sprachen/en.lproj
        buildPhase: resources
      # Deutsch ist die Entwicklungssprache und braucht keine
      # Localizable.strings — aber ohne einen eigenen .lproj-Ordner im
      # Buendel gilt fuer iOS nur Englisch als angebotene Sprache, und ein
      # deutsches Telefon bekaeme die App auf Englisch. Derselbe Trick wie
      # fuer den Mac in build.sh.
      - path: Resources/Sprachen/de.lproj
        buildPhase: resources
      - path: Resources/AppIconiOS.xcassets
        buildPhase: resources
      # Die GPL-3.0 gehoert ins Buendel, nicht nur als Verweis: Das Ueber-Blatt
      # zeigt den Text an, und die Lizenz verlangt, ihn mitzuliefern. Die drei
      # OFL-Texte der Pixelschriften fahren schon mit, weil `Resources/Schriften`
      # oben als ganzer Ordner mitgeht — die LICENSE liegt in der Wurzel und
      # braucht deshalb ihre eigene Zeile. Am Mac tut dasselbe `build.sh`.
      - path: LICENSE
        buildPhase: resources
      # Die zusaetzliche Erlaubnis nach GPL-Abschnitt 7 — ohne sie im Buendel
      # kann sich der Empfaenger nicht darauf berufen, und ohne sie waere die
      # Verbreitung ueber den App Store ein Lizenzverstoss.
      - path: LIZENZ-AUSNAHME.md
        buildPhase: resources
      # Das Datenschutzmanifest. Apple verlangt es seit Mai 2024, sobald die App
      # eine „API mit Begruendungspflicht" benutzt — `UserDefaults` ist eine.
      # Es muss in der **Wurzel** des Buendels liegen, nicht in einem Ordner.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Die Geraetereferenz, beide Sprachen. `GeraeteReferenzView` liegt seit
      # dem Umzug in `TC002Ansichten` und wird damit auch fuers iPhone
      # uebersetzt; sie sucht das Dokument in der Buendelwurzel und zeigt sonst
      # einen Fehlerschirm, der aufs Bauen mit ./build.sh verweist — am iPhone
      # eine Begruendung in die falsche Richtung. Einzelne Dateien, kein
      # `type: folder`: Sie sollen in der Wurzel liegen, nicht in `docs/`. Am
      # Mac kopiert `build.sh` dieselben zwei.
      - path: docs/tc002-protokoll.md
        buildPhase: resources
      - path: docs/en/tc002-protocol.md
        buildPhase: resources
      # Dieselben zwei fuer AWTRIX NG: Die Referenzansicht laesst zwischen den
      # Gattungen waehlen, und eine Wahl, hinter der keine Datei liegt, zeigte
      # den Fehlerschirm.
      - path: docs/awtrix-ng-protokoll.md
        buildPhase: resources
      - path: docs/en/awtrix-ng-protocol.md
        buildPhase: resources
    # **Nach allen anderen Schritten, aber vor dem Signieren.** Xcode fuehrt
    # Skriptschritte in der Reihenfolge der Bauphasen aus und signiert erst
    # danach — eine Aenderung an der Info.plist hier macht die Signatur also
    # nicht ungueltig. Umgekehrt waere sie es: Wer nach dem Signieren schreibt,
    # bekommt ein Buendel, das nirgends mehr laeuft.
    postBuildScripts:
      - name: Fassung und Baunummer aus Git
        script: sh "$PROJECT_DIR/scripts/fassung-eintragen.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: TC002
        product: TC002Core
      - package: TC002
        product: TC002Modell
      - package: TC002
        product: TC002Ansichten
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.eriks.mqtt-tc002
        DEVELOPMENT_TEAM: 25ZK4SS655
        CODE_SIGN_STYLE: Automatic
        # **Nur die Rueckfallwerte.** Die wirklichen Zahlen schreibt der
        # Bauschritt unten aus Git in die fertige Info.plist — dieselbe Quelle,
        # aus der `build.sh` die Mac-Fassung nimmt (juengstes Tag, Zahl der
        # Commits). Standen hier feste Werte, lud jeder TestFlight-Upload
        # dieselbe Baunummer hoch, und App Store Connect nimmt keine zweimal:
        # Der erste ginge durch, der zweite nicht.
        MARKETING_VERSION: "0.0"
        CURRENT_PROJECT_VERSION: "0"
        # Der Bauschritt ruft `git`; in einer Sandkiste gaebe es das nicht.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_ASSET_PATHS: ""
        # **Der Behaelter steht seit dem 14.09.2026 im Entwicklerkonto**, damit
        # gilt diese Zeile. Ein Bau aufs Geraet braucht ein
        # Bereitstellungsprofil, das `iCloud.cloud.eriks.mqtt-tc002` enthaelt;
        # Xcode holt es bei automatischer Signatur selbst, seit der Behaelter
        # im Konto angelegt ist. Ein Simulatorbau gelingt uebrigens auch ohne
        # das alles — dort wird ad hoc signiert und kein Profil geprueft, er
        # beweist darum nichts.
        #
        # **Und sie gehoert hierher, nicht in Xcode.** Wer die Faehigkeit
        # „iCloud" im Xcode-Blatt „Signing & Capabilities" einschaltet,
        # schreibt in die `.xcodeproj` — die ist nicht eingecheckt und wird
        # beim naechsten `xcodegen generate` ueberschrieben. Xcode war der Weg,
        # den Behaelter im **Konto** anzulegen; eingetragen ist er hier.
        CODE_SIGN_ENTITLEMENTS: Resources/MQTT-TC002.entitlements
    info:
      # NICHT nach build/ — das ist das Ausgabeverzeichnis der Mac-App, und
      # `release.sh` raeumt es mit `rm -rf` ab. Diese Datei ist aber eine
      # **Eingabe** des iOS-Projekts: Ist sie weg, bricht Xcode mit
      # „Build input file cannot be found" ab. Am 12.09.2026 genau so passiert,
      # mitten in einer Veroeffentlichung.
      path: erzeugt/InfoiOS.plist
      properties:
        # Der Anzeigename; die Kennung bleibt `cloud.eriks.mqtt-tc002`.
        CFBundleName: Pixel Clock Messenger
        CFBundleDisplayName: Pixel Clock Messenger
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        # Zwei Schluessel, nicht einer: Das iPhone bleibt im Hochformat — die
        # iPhone-Oberflaeche (`SendeniOS`) ist darauf gerechnet. Das iPad zeigt
        # den Schreibtisch und dreht sich, quer wie hochkant. Fehlte die
        # `~ipad`-Fassung, gaelte der Schluessel darunter auch dort, und auf dem
        # iPad staende eine hochformatgesperrte Schreibtischoberflaeche — ein
        # Bau, der gelingt, und ein Geraet, das sich nicht drehen laesst.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Ohne diesen Eintrag erreicht die App weder Uhr noch Broker, und die
        # Fehlermeldung zeigt in die falsche Richtung — derselbe Fall wie auf
        # dem Mac.
        # **Die Ausfuhrerklaerung, ein fuer alle Mal.** Ohne diesen Schluessel
        # fragt App Store Connect bei **jedem** Upload nach — und ein Bau, der
        # auf eine Frage wartet, laedt nicht hoch. Die App verschluesselt
        # nichts selbst: Das Brokerkennwort liegt im Schluesselbund (System),
        # und MQTT geht unverschluesselt ins Heimnetz.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: >-
          Die App spricht die Pixeluhr und den MQTT-Broker in Ihrem Heimnetz an.
        # Damit der Behaelter in „Dateien" und in iCloud Drive auftaucht, statt
        # unsichtbar zu bleiben: Icons und Bilder werden als GIF gesichert,
        # gerade damit man sie auch ausserhalb der App sieht — im Behaelter
        # soll das so bleiben. Der Schluessel schadet nichts, solange es den
        # Behaelter nicht gibt; er beschreibt nur, wie er heissen soll.
        NSUbiquitousContainers:
          iCloud.cloud.eriks.mqtt-tc002:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: MQTT-TC002
            NSUbiquitousContainerSupportedFolderLevels: Any
